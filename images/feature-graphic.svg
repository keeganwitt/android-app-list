<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img"
    aria-labelledby="title description">
    <title id="title">App List feature graphic</title>
    <desc id="description">List all apps, including system apps, and compare eighteen application
        fields.
    </desc>

    <rect width="1024" height="500" fill="#3DDC84" />

    <g transform="translate(82 0)">
        <g fill="#000000" font-family="Roboto, Arial, sans-serif">
            <text x="36" y="58" font-size="40" font-weight="700">List all apps (including system ones) with</text>

            <g font-size="27" font-weight="600">
                <text x="38" y="112">• APK Size</text>
                <text x="38" y="154">• Archived</text>
                <text x="38" y="196">• Data Size</text>
                <text x="38" y="238">• Exists in App Store</text>
                <text x="38" y="280">• First Installed</text>
                <text x="38" y="322">• Last Updated</text>
                <text x="38" y="364">• Min SDK</text>
                <text x="38" y="406">• Requested Permissions</text>
                <text x="38" y="448">• Total Size</text>

                <text x="534" y="112">• App Size</text>
                <text x="534" y="154">• Cache Size</text>
                <text x="534" y="196">• Enabled</text>
                <text x="534" y="238">• External Cache Size</text>
                <text x="534" y="280">• Granted Permissions</text>
                <text x="534" y="322">• Last Used</text>
                <text x="534" y="364">• Package Manager</text>
                <text x="534" y="406">• Target SDK</text>
                <text x="534" y="448">• Version</text>
            </g>
        </g>
    </g>
</svg>
